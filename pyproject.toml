[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-pytest-framework"
version = "1.0.0"
description = "A production-ready Playwright automation framework built from scratch"
requires-python = ">=3.8"
dependencies = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "pytest-html>=4.1.1",
    "allure-pytest>=2.16.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --headed: shows the browser, --html: generates execution report
addopts = """
    -v -s
    --html=reports/report.html
    --self-contained-html
    --capture=no
    --browser chromium --browser firefox
    --screenshot=only-on-failure
    --video=retain-on-failure
    --alluredir=reports
"""
markers = [
    "smoke: Quick smoke tests",
    "regression: Full regression suite"
]

[tool.setuptools.packages.find]
# Only scan your actual code directories.
# Anything else added to the root (like maps, reports, profiles, or logs) is automatically ignored!
include = ["pages", "configs", "tests"]